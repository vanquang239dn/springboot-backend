services:
  backend-service:
    # Use build with Dockerfile
    # build:
    #   context: ./
    #   dockerfile: Dockerfile
    image: vanquang239dnn/backend-service:${IMAGE_TAG:-latest}
    container_name: backend-service
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}

      - DEV_POSTGRES_URL=${DEV_POSTGRES_DOCKER_URL}
      - DEV_POSTGRES_USERNAME=${DEV_POSTGRES_USERNAME}
      - DEV_POSTGRES_PASSWORD=${DEV_POSTGRES_PASSWORD}

      - DEV_SERVER_PORT=${DEV_SERVER_PORT}

      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_SENDER_EMAIL=${SENDGRID_SENDER_EMAIL}

      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MINUTES=${JWT_EXPIRATION_MINUTES}
      - JWT_EXPIRATION_DAYS=${JWT_EXPIRATION_DAYS}
      - JWT_ACCESS_SECRET_KEY=${JWT_ACCESS_SECRET_KEY}
      - JWT_REFRESH_SECRET_KEY=${JWT_REFRESH_SECRET_KEY}

      - LOGSTASH_HOST=${LOGSTASH_DOCKER_HOST}
      - ZIPKIN_HOST=http://${ZIPKIN_DOCKER_HOST}
      - PROMETHEUS_HOST=${PROMETHEUS_HOST}

    depends_on:
      logstash:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - backend-network
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0

  logstash:
    image: logstash:7.14.1
    container_name: logstash
    restart: unless-stopped
    expose:
      - "5000"
      - "9600"
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      elastic-search:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/_node/pipelines || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend-network
    security_opt:
      - no-new-privileges:true

  elastic-search:
    image: elasticsearch:7.14.1
    container_name: elasticsearch
    restart: unless-stopped
    expose:
      - "9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend-network

  kibana:
    image: kibana:7.14.1
    container_name: kibana
    restart: unless-stopped
    ports:
      - "${KIBANA_PORT}:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elastic-search:9200
    depends_on:
      elastic-search:
        condition: service_healthy
    networks:
      - backend-network

  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: zipkin
    restart: unless-stopped
    ports:
      - "${ZIPKIN_PORT}:9411"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend-network

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend-network

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT}:3000"
    environment: # account: grafana/password
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - backend-network

networks:
  backend-network:
    name: backend-service-network