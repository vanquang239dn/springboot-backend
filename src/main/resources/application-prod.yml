server:
    port: ${PROD_SERVER_PORT}
    error:
        include-message: never
        include-stacktrace: never

spring:
    config:
        activate:
            on-profile: prod

    datasource:
        url: ${TEST_POSTGRES_URL}
        username: ${TEST_POSTGRES_USERNAME}
        password: ${TEST_POSTGRES_PASSWORD}

    jpa:
        hibernate:
            # Chỉ validate schema
            ddl-auto: validate

        # Không log SQL ở production
        show-sql: false

        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: false

    flyway:
        enabled: true
        locations: classpath:db/migration

        baseline-on-migrate: true

        # Disable clean production DB
        clean-disabled: true

    springdoc:
        enabled: false

        swagger-ui:
            enabled: false
