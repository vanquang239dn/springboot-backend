spring:
    application:
        name: backend-service
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:dev}
    flyway:
        enabled: true
        locations: classpath:db/migration

management:
    endpoints:
        web:
            exposure:
                include: health, info

    tracing:
        sampling:
            probability: 1.0

    zipkin:
        tracing:
            endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
    level:
        root: INFO
