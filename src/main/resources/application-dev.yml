spring:
    config:
        activate:
            on-profile: dev

    devtools:
        add-properties: true

    datasource:
        url: jdbc:postgresql://localhost:5432/dev_backend_service
        username: dev_user
        password: dev_pass

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: true

    springdoc:
    api-docs:
        path: /v3/api-docs
    enabled: true
    swagger-ui:
        enabled: true

openapi:
    service:
        api-docs: v3/api-docs
        title: Backend Service API Document for Development
        description: API documentation for Backend Service
        version: 1.0.0
        server: http://localhost:${server.port}
