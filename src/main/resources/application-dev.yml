spring:
    config:
        activate:
            on-profile: dev

    devtools:
        add-properties: true

    datasource:
        url: jdbc:postgresql://localhost:5432/dev_backend_service
        username: dev_user
        password: devpass

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true

        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: true

    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true

    springdoc:
        api-docs:
            path: /v3/api-docs
        enabled: true

        swagger-ui:
            enabled: true

server:
    error:
        include-message: always
        include-stacktrace: always

openapi:
    service:
        api-docs: v3/api-docs
        title: Backend Service API Document for Development
        description: API documentation for Backend Service
        version: 1.0.0
        server: http://localhost:${server.port}
